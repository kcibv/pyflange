# Runs the test suite: unit tests, validation against the SGRE reference
# values (tests/flangesegments_test.py runs validations/validate.py) and the
# documentation examples (tests/docs_test.py).
#
# It runs on every push and pull request to main and dev, on the oldest and
# newest supported Python versions, on Linux and on Windows (the platform of
# most PyFlange users).

name: Tests

on:
  push:
    branches: [main, dev]
    paths-ignore: ["docs/**"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install PyFlange and the test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest matplotlib

      - name: Run the tests
        run: python -m pytest

  build:
    name: Build the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir build-dist
      - name: Install the wheel and run the command line
        run: |
          python -m pip install build-dist/*.whl
          cd /tmp && pyflange --version && pyflange --help
