site_name: PyFlange Documentation
docs_dir: docsrc
site_dir: docs
nav:
    - Home: index.md
    - API's:
      - bolts: apis/bolts.md
      - flangesegments: apis/flangesegments.md
      - fatigue: apis/fatigue.md
      - stats: apis/stats.md
      - utils: apis/utils.md
    - Deprecated API's:
      - gap: apis/gap.md
    - Examples:
      - Montecarlo Simulation: examples/montecarlo.md
theme:
    name: readthedocs
    logo: assets/logo.svg
    favicon: assets/logo.ico

plugins:
- mkdocstrings:
    default_handler: python
    handlers:
      python:
        paths: [src]
        options:
          show_root_heading: true
          heading_level: 1
          show_source: false
          docstring_style: google
          show_signature_annotations: true

markdown_extensions:
- admonition
- pymdownx.arithmatex:
    generic: true
- pymdownx.superfences

extra_javascript:
- https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
